<!DOCTYPE html>
<html lang="ru">
<head>

<title>Tower Defense: Три Мира</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;touch-action:none;position:fixed}
#app{display:flex;flex-direction:column;width:100%;height:100%}
#hud{display:flex;justify-content:space-around;align-items:center;padding:5px 4px;background:linear-gradient(180deg,#1a1a1f 0%,#0a0a0a 100%);border-bottom:1px solid #222;font-size:12px;font-weight:700;position:relative;z-index:5}
#hud::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(74,158,255,.5),transparent)}
.hud-item{display:flex;align-items:center;gap:3px;padding:3px 7px;border-radius:7px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);font-size:12px;font-weight:700}
.hud-item .v{color:#ffd700}
.hud-item .life{color:#ff5555}
.hud-item .wave{color:#79c0ff}
.hud-item .bank{color:#66e0ff}
#gameWrap{flex:1;position:relative;overflow:hidden;min-height:0;background:#000}
#c{display:block;width:100%;height:100%;image-rendering:pixelated}
#topBtns{position:absolute;top:6px;right:6px;z-index:20;display:flex;flex-direction:column;gap:4px}
.topBtn{width:36px;height:36px;border-radius:9px;background:rgba(20,20,25,.85);border:1.5px solid #333;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;transition:all .15s;backdrop-filter:blur(6px);position:relative}
.topBtn:active{transform:scale(.9)}
.topBtn.active{border-color:#ffd700;background:rgba(42,32,0,.95);color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.5)}
.topBtn .lbl{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font-size:8px;color:#888;font-weight:600;white-space:nowrap}
.topBtn.active .lbl{color:#ffd700}
#bottom{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,#0a0a0a 0%,#1a1a1f 100%);border-top:1px solid #222;position:relative}
#bottom::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(74,158,255,.5),transparent)}
.tower-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;background:linear-gradient(180deg,#1e1e22,#15151a);border:1.5px solid #2a2a30;border-radius:9px;color:#fff;font-family:inherit;cursor:pointer;min-height:52px;transition:all .15s;line-height:1}
.tower-card:active{transform:scale(.93)}
.tower-card.selected{border-color:#ffd700;background:linear-gradient(180deg,#2a2000,#1a1400);box-shadow:0 0 14px rgba(255,215,0,.5)}
.tower-card.disabled{opacity:.35;filter:grayscale(.8)}
.tower-card .ic{font-size:19px;line-height:1}
.tower-card .nm{font-size:8px;color:#c9d1d9;font-weight:700;text-align:center;margin-top:1px}
.tower-card .cost{color:#ffd700;font-weight:800;font-size:10px}
#waveBtn{grid-column:1 / -1;display:flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(180deg,#2a7feb 0%,#0d47a1 100%);border:2px solid #4a9eff;border-radius:10px;color:#fff;font-family:inherit;font-weight:800;cursor:pointer;height:40px;padding:0 8px;letter-spacing:1px;box-shadow:0 0 15px rgba(74,158,255,.35);transition:all .15s}
#waveBtn:active{transform:scale(.97)}
#waveBtn.ready{animation:wglow 1.2s infinite}
@keyframes wglow{0%,100%{box-shadow:0 0 0 0 rgba(74,158,255,.7)}50%{box-shadow:0 0 20px 4px rgba(74,158,255,.5)}}
#waveBtn .ic{font-size:16px}
#waveBtn .nm{font-size:12px}
#waveBtn .cost{color:#cce0ff;font-size:12px;font-weight:900}
#overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(30,20,50,.97),rgba(0,0,0,.98));display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:100;overflow-y:auto;gap:12px;text-align:center}
#overlay.active{display:flex;animation:ovIn .3s ease}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
#overlay h1{font-size:26px;letter-spacing:2px;background:linear-gradient(180deg,#ffd700,#b8860b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 8px rgba(255,215,0,.5));font-weight:900}
#overlay .desc{color:#c9d1d9;font-size:13px;line-height:1.5;max-width:360px}
#overlay .box{background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(255,215,0,.2);border-radius:12px;padding:12px 16px;max-width:380px;width:100%;text-align:left;font-size:12px;color:#a8a8b0;line-height:1.8}
#overlay .box b{color:#ffd700;font-weight:800}
.map-btn{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;max-width:340px;padding:14px 18px;background:linear-gradient(135deg,#1a1a2e,#0d1117);border:2px solid #2a2a30;border-radius:14px;color:#fff;font-family:inherit;cursor:pointer;transition:all .15s;text-align:left;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.map-btn::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 0% 100%,var(--mc,rgba(255,255,255,.1)),transparent 60%);opacity:.4;pointer-events:none}
.map-btn:active{transform:scale(.97)}
.map-btn.locked{opacity:.4;filter:grayscale(1)}
.map-btn[data-map="forest"]{--mc:rgba(80,200,80,.3)}
.map-btn[data-map="volcano"]{--mc:rgba(255,120,0,.3)}
.map-btn[data-map="hell"]{--mc:rgba(255,0,0,.3)}
.map-btn .row1{display:flex;align-items:center;gap:12px;width:100%;position:relative;z-index:1}
.map-btn .icon{font-size:32px;flex-shrink:0}
.map-btn .title{font-size:17px;font-weight:800;flex:1}
.map-btn .diff{font-size:10px;padding:3px 9px;border-radius:8px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);font-weight:800}
.map-btn .desc{font-size:11px;color:#8b949e;text-align:left;width:100%;margin-top:5px;line-height:1.4;position:relative;z-index:1}
.map-btn .cont{position:absolute;top:10px;right:10px;background:linear-gradient(180deg,#ffd700,#b8860b);color:#000;padding:3px 9px;border-radius:8px;font-size:10px;font-weight:900;box-shadow:0 0 10px rgba(255,215,0,.5);z-index:2}
#startBtn{padding:12px 40px;font-size:14px;font-weight:900;background:linear-gradient(180deg,#ffd700,#ffb300);color:#000;border:none;border-radius:12px;box-shadow:0 5px 0 #b8860b;font-family:inherit;letter-spacing:2px;cursor:pointer;transition:all .1s}
#startBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8860b}
#smallBtn{padding:8px 20px;font-size:11px;background:rgba(255,255,255,.03);color:#8b949e;border:1px solid rgba(255,255,255,.1);border-radius:8px;font-family:inherit;cursor:pointer;font-weight:700}
#smallBtn:active{background:rgba(255,255,255,.08)}
#bankDisplay{background:linear-gradient(135deg,rgba(102,224,255,.15),rgba(102,224,255,.02));border:1px solid rgba(102,224,255,.35);border-radius:14px;padding:10px 24px;display:flex;flex-direction:column;gap:3px;align-items:center;box-shadow:0 0 20px rgba(102,224,255,.15)}
#bankDisplay .lbl{color:#66e0ff;font-size:10px;letter-spacing:3px;font-weight:900}

#cutscene{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,rgba(20,10,30,.98),rgba(0,0,0,.99));display:none;align-items:center;justify-content:center;z-index:200;padding:24px;animation:csFade .4s ease}
#cutscene.active{display:flex}
@keyframes csFade{from{opacity:0}to{opacity:1}}
.cs-box{background:linear-gradient(135deg,rgba(30,20,50,.9),rgba(10,5,20,.95));border:2px solid rgba(255,215,0,.35);border-radius:20px;padding:28px 24px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px;box-shadow:0 0 40px rgba(255,215,0,.2),inset 0 1px 0 rgba(255,255,255,.1);animation:csSlide .5s ease}
@keyframes csSlide{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.cs-icon{font-size:72px;line-height:1;filter:drop-shadow(0 4px 20px rgba(255,215,0,.5));animation:csFloat 3s ease-in-out infinite}
@keyframes csFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.cs-title{font-size:22px;font-weight:900;letter-spacing:1.5px;background:linear-gradient(180deg,#ffd700,#b8860b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase}
.cs-text{color:#d0d0d8;font-size:14px;line-height:1.7;font-style:italic;padding:0 4px}
.cs-btn{padding:12px 36px;font-size:14px;font-weight:900;background:linear-gradient(180deg,#ffd700,#ffb300);color:#000;border:none;border-radius:12px;box-shadow:0 5px 0 #b8860b;font-family:inherit;letter-spacing:2px;cursor:pointer;margin-top:4px;align-self:center}

.cs-hint{font-size:11px;color:#666;font-style:italic}
</style>

<script>
(function(){
'use strict';

let timeScale = 1;

const SAVE_KEY = 'td_three_worlds_v7';
let save = { bank:0, unlocked:{forest:true,volcano:false,hell:false}, bestWaves:{forest:0,volcano:0,hell:0}, pending:null, storySeen:{forest:false,volcano:false,hell:false} };
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p){
        save.bank = p.bank||0;
        if(p.unlocked) Object.assign(save.unlocked, p.unlocked);
        if(p.bestWaves) Object.assign(save.bestWaves, p.bestWaves);
        if(p.storySeen) Object.assign(save.storySeen, p.storySeen);
        save.pending = p.pending||null;
      }
    }
  }catch(e){}
}
function persistSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0,H=0,dpr=1,CELL=0,OX=0,OY=0;
const COLS=10, ROWS=14;

let vignetteCache = null;
let staticLayer = null;
let fontCache = {};

function getFont(size, weight){
  const key = weight+'_'+size;
  if(!fontCache[key]) fontCache[key] = (weight?weight+' ':'') + size + 'px sans-serif';
  return fontCache[key];
}

function resize(){
  const wrap = canvas.parentElement;
  W = wrap.clientWidth || window.innerWidth;
  H = wrap.clientHeight || (window.innerHeight - 120);
  if(W<10) W = window.innerWidth;
  if(H<10) H = window.innerHeight - 120;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W*dpr);
  canvas.height = Math.floor(H*dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled = false;
  CELL = Math.min(W/COLS, H/ROWS);
  OX = (W - CELL*COLS)/2;
  OY = (H - CELL*ROWS)/2;
  vignetteCache = null;
  fontCache = {};
  if(currentMap) buildStaticLayer();
}

function buildPath(sc,sr,segs){
  const path=[[sc,sr]]; let c=sc,r=sr;
  for(const s of segs){
    for(let i=0;i<s.len;i++){
      if(s.d==='R')c++; else if(s.d==='L')c--;
      else if(s.d==='D')r++; else if(s.d==='U')r--;
      path.push([c,r]);
    }
  }
  return path;
}

function getWave(mapId, waveNum){
  const list = [];
  const push = (t,c)=>{ if(c>0) list.push({type:t,count:c}); };

  if(mapId === 'forest'){
    // ЛЕГКИЙ УРОВЕНЬ — только базовая механика
    if(waveNum === 25){ push('hydra',1); push('orc',6); push('wolf',4); return list; }
    push('skeleton', 4 + Math.floor(waveNum*0.9));
    if(waveNum >= 3) push('wolf', 2 + Math.floor(waveNum*0.5));
    if(waveNum >= 6) push('orc', Math.max(1, Math.floor((waveNum-5)*0.6)));
    // Призраки только с 10-й, и мало — чтобы научить игрока про лучника 2 ур.
    if(waveNum >= 10) push('ghost', Math.max(1, Math.floor((waveNum-9)*0.5)));
  }
  else if(mapId === 'volcano'){
    // СРЕДНИЙ УРОВЕНЬ — големы в броне + быстрые + маги
    if(waveNum === 25){ push('dragon',1); push('magma_golem',4); push('salamander',6); push('fire_mage',2); return list; }
    push('fire_spirit', 6 + Math.floor(waveNum*1.3));
    if(waveNum >= 2) push('salamander', 4 + Math.floor(waveNum*1.0));
    if(waveNum >= 3) push('lava_imp', Math.floor(waveNum*0.9));
    if(waveNum >= 4) push('magma_golem', Math.max(1, Math.floor((waveNum-3)*0.7)));
    if(waveNum >= 10) push('fire_mage', Math.max(1, Math.floor((waveNum-9)*0.6)));
  }
  else if(mapId === 'hell'){
    // СЛОЖНЫЙ УРОВЕНЬ — всё вместе + рой + лечение + броня
    if(waveNum === 25){ push('devil',1); push('cerberus',4); push('vampire',6); push('succubus',4); return list; }
    push('imp', 8 + Math.floor(waveNum*1.5));
    if(waveNum >= 2) push('vampire', 4 + Math.floor(waveNum*1.0));
    if(waveNum >= 3) push('demon', Math.floor(waveNum*0.9));
    if(waveNum >= 4) push('cerberus', Math.max(1, Math.floor((waveNum-3)*0.7)));
    if(waveNum >= 10) push('succubus', Math.max(1, Math.floor((waveNum-9)*0.6)));
    // Волна роя каждые 3 волны — нужна пушка
    if(waveNum % 3 === 0 && waveNum < 25){
      for(let i=0; i<15 + waveNum; i++) push('imp', 1);
    }
  }
  return list;
}

    });

function buildStaticLayer(){
  if(!currentMap || W<1 || H<1) return;
  if(!staticLayer) staticLayer = document.createElement('canvas');
  staticLayer.width = Math.floor(W*dpr);
  staticLayer.height = Math.floor(H*dpr);
  const sctx = staticLayer.getContext('2d');
  sctx.setTransform(dpr,0,0,dpr,0,0);
  sctx.imageSmoothingEnabled = false;

  const g = sctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, currentMap.bg1);
  g.addColorStop(1, currentMap.bg2);
  sctx.fillStyle = g;
  sctx.fillRect(0,0,W,H);

  sctx.fillStyle = currentMap.floor;
  sctx.fillRect(OX, OY, CELL*COLS, CELL*ROWS);

  for(let r=0; r<ROWS; r++){
    for(let c=0; c<COLS; c++){
      if(currentPathSet.has(c+','+r)) continue;
      sctx.fillStyle = ((r+c)%2===0) ? 'rgba(255,255,255,.02)' : 'rgba(0,0,0,.05)';
      sctx.fillRect(OX+c*CELL, OY+r*CELL, CELL, CELL);
    }
  }

  sctx.strokeStyle = 'rgba(255,255,255,.04)';
  sctx.lineWidth = 1;
  sctx.beginPath();
  for(let c=0;c<=COLS;c++){ sctx.moveTo(OX+c*CELL,OY); sctx.lineTo(OX+c*CELL,OY+CELL*ROWS); }
  for(let r=0;r<=ROWS;r++){ sctx.moveTo(OX,OY+r*CELL); sctx.lineTo(OX+CELL*COLS,OY+r*CELL); }
  sctx.stroke();

  drawDecorations(sctx);

  for(const p of currentMap.path){
    const x = OX+p[0]*CELL;
    const y = OY+p[1]*CELL;
    sctx.fillStyle = currentMap.pathEdge;
    sctx.fillRect(x,y,CELL,CELL);
    sctx.fillStyle = currentMap.path;
    sctx.fillRect(x+2,y+2,CELL-4,CELL-4);
  }
}

function drawDecorations(sctx){
  const dec = currentMap.decorations;
  if(!dec) return;
  if(dec.trees){
    for(const [c,r] of dec.trees){
      if(currentPathSet.has(c+','+r)) continue;
      const x = OX+(c+0.5)*CELL;
      const y = OY+(r+0.5)*CELL;
      sctx.fillStyle = 'rgba(0,0,0,.4)';
      sctx.beginPath(); sctx.ellipse(x, y+CELL*0.3, CELL*0.3, CELL*0.1, 0, 0, Math.PI*2); sctx.fill();
      sctx.fillStyle = '#3a2818';
      sctx.fillRect(x-CELL*0.05, y, CELL*0.1, CELL*0.3);
      const treeCol = currentMap.id==='forest' ? '#1a5c1a' : (currentMap.id==='volcano' ? '#4a1a0a' : '#3a0808');
      sctx.fillStyle = treeCol;
      sctx.beginPath(); sctx.arc(x, y-CELL*0.05, CELL*0.3, 0, Math.PI*2); sctx.fill();
    }
  }
  if(dec.rocks){
    for(const [c,r] of dec.rocks){
      if(currentPathSet.has(c+','+r)) continue;
      const x = OX+(c+0.5)*CELL;
      const y = OY+(r+0.5)*CELL;
      sctx.fillStyle = 'rgba(0,0,0,.3)';
      sctx.beginPath(); sctx.ellipse(x, y+CELL*0.15, CELL*0.22, CELL*0.08, 0, 0, Math.PI*2); sctx.fill();
      sctx.fillStyle = '#555';
      sctx.beginPath();
      sctx.moveTo(x-CELL*0.2, y+CELL*0.12);
      sctx.lineTo(x-CELL*0.1, y-CELL*0.15);
      sctx.lineTo(x+CELL*0.08, y-CELL*0.18);
      sctx.lineTo(x+CELL*0.2, y+CELL*0.1);
      sctx.closePath();
      sctx.fill();
    }
  }
  if(dec.lava){
    for(const [c,r] of dec.lava){
      if(currentPathSet.has(c+','+r)) continue;
      const x = OX+(c+0.5)*CELL;
      const y = OY+(r+0.5)*CELL;
      const lg = sctx.createRadialGradient(x,y,0,x,y,CELL*0.35);
      lg.addColorStop(0, 'rgba(255,200,50,.7)');
      lg.addColorStop(0.5, 'rgba(255,80,0,.5)');
      lg.addColorStop(1, 'rgba(100,20,0,0)');
      sctx.fillStyle = lg;
      sctx.beginPath(); sctx.arc(x, y, CELL*0.35, 0, Math.PI*2); sctx.fill();
    }
  }
  if(dec.skulls){
    for(const [c,r] of dec.skulls){
      if(currentPathSet.has(c+','+r)) continue;
      const x = OX+(c+0.5)*CELL;
      const y = OY+(r+0.5)*CELL;
      sctx.fillStyle = '#ddd';
      sctx.beginPath(); sctx.arc(x, y, CELL*0.13, 0, Math.PI*2); sctx.fill();
      sctx.fillStyle = '#000';
      sctx.beginPath();
      sctx.arc(x-CELL*0.04, y-CELL*0.02, CELL*0.03, 0, Math.PI*2);
      sctx.arc(x+CELL*0.04, y-CELL*0.02, CELL*0.03, 0, Math.PI*2);
      sctx.fill();
    }
  }
}

function wps(){
  return currentMap.path.map(p=>({ x:OX+(p[0]+0.5)*CELL, y:OY+(p[1]+0.5)*CELL }));
}

function updateHUD(){
  document.getElementById('hMoney').textContent = money;
  document.getElementById('hLives').textContent = lives;
  document.getElementById('hWave').textContent = wave+'/25';
  document.getElementById('hBank').textContent = save.bank;
}

function updateCards(){
  document.querySelectorAll('.tower-card').forEach(el=>{
    const t = el.getAttribute('data-type');
    const def = TOWER_DEFS[t];
    el.classList.toggle('selected', selectedType===t);
    el.classList.toggle('disabled', money<def.cost);
  });
  const wb = document.getElementById('waveBtn');
  if(!waveActive && gameState==='playing' && !cutsceneActive){
    wb.classList.add('ready');
    document.getElementById('waveCost').textContent = '+'+(8+wave*2);
  } else {
    wb.classList.remove('ready');
    document.getElementById('waveCost').textContent = waveActive?'...':'СТАРТ';
  }
}

function showCutscene(cs, onComplete){
  cutsceneActive = true;
  const el = document.getElementById('cutscene');
  document.getElementById('csIcon').textContent = cs.icon;
  document.getElementById('csTitle').textContent = cs.title;
  document.getElementById('csText').innerHTML = cs.text.replace(/\n/g, '<br>');
  el.classList.add('active');
  paused = true;
  pendingCutsceneAfter = onComplete || null;
  updateCards();
}

function closeCutscene(){
  document.getElementById('cutscene').classList.remove('active');
  cutsceneActive = false;
  paused = false;
  lastTime = 0;
  const cb = pendingCutsceneAfter;
  pendingCutsceneAfter = null;
  updateCards();
  if(cb) cb();
}

document.getElementById('csBtn').addEventListener('click', closeCutscene);
document.getElementById('csBtn').addEventListener('touchstart', e=>{
  e.preventDefault(); closeCutscene();
}, { passive:false });
document.getElementById('cutscene').addEventListener('click', e=>{
  if(e.target.id === 'cutscene' || e.target.classList.contains('cs-hint')) closeCutscene();
});

function checkWaveCutscene(mapId, waveNum){
  const stories = STORIES[mapId];
  if(!stories) return null;
  if(waveNum === 5) return stories.w5;
  if(waveNum === 10) return stories.w10;
  if(waveNum === 20) return stories.w20;
  if(waveNum === 25) return stories.w25;
  return null;
}

function startWave(){
  if(waveActive || wave>=25 || cutsceneActive) return;
  const nextWave = wave + 1;
  const cs = checkWaveCutscene(currentMap.id, nextWave);
  if(cs) showCutscene(cs, ()=>doStartWave());
  else doStartWave();
}

function doStartWave(){
  wave++;
  if(wave>1) money += 8 + wave*2;
  const comp = getWave(currentMap.id, wave);
  spawnQueue = [];
  comp.forEach(g=>{
    for(let i=0;i<g.count;i++) spawnQueue.push({ type:g.type, delay:0.42 });
  });
  spawnTimer = 0;
  waveActive = true;
  updateHUD(); updateCards();
  saveProgress();
}

function saveProgress(){
  save.pending = {
    mapId: currentMap.id, wave: wave, money: money, lives: lives,
    towers: towers.map(t=>({col:t.col,row:t.row,type:t.type,level:t.level}))
  };
  persistSave();
}

function spawnEnemy(type){
  const def = ENEMIES[type];
  const hpScale = 1 + (wave-1)*0.3;
  const hp = Math.floor(def.hp * hpScale);
  const wp = wps();
  const e = {
    type, def, x:wp[0].x, y:wp[0].y, wpIndex:1,
    hp, maxHp:hp, speed:def.speed,
    slowUntil:0, slowFactor:1, hitFlash:0,
    ghost:!!def.ghost, boss:!!def.boss, r:def.r,
    reward:def.reward,
    armor: def.armor || 0,
    abilityCd: def.ability ? def.ability.cd*0.5 : 0,
    poisonedUntil:0, poisonDps:0
  };
  if(def.heads){ e.heads=def.heads; e.headIndex=0; e.headHp=Math.floor(hp/def.heads); e.maxHeadHp=e.headHp; }
  enemies.push(e);
  if(def.boss) bossRef = e;
}

function updateEnemies(dt){
  const now = performance.now();
  const wp = wps();
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(e.hitFlash>0) e.hitFlash -= dt;
    if(e.poisonedUntil > now && e.poisonDps > 0){
      if(e.heads){
        e.headHp -= e.poisonDps*dt;
        if(e.headHp<=0 && e.heads>0){ e.headIndex++; e.heads--; if(e.heads>0) e.headHp = e.maxHeadHp; }
      } else e.hp -= e.poisonDps*dt;
      if(parts.length < 200 && Math.random()<0.1){
        parts.push({ x:e.x+(Math.random()-0.5)*15, y:e.y-8, vx:0, vy:-25, life:0.5, maxLife:0.5, color:'#66ff66', size:3 });
      }
    }
    if(e.heads ? e.heads<=0 : e.hp<=0){ killEnemy(e,i); continue; }
    if(e.def.ability){
      e.abilityCd -= dt;
      if(e.abilityCd<=0){ e.abilityCd = e.def.ability.cd; useAbility(e); }
    }
    const factor = now<e.slowUntil ? e.slowFactor : 1;
    let rem = e.speed * CELL * factor * dt;
    while(rem>0 && e.wpIndex < wp.length){
      const t = wp[e.wpIndex];
      const dx = t.x-e.x, dy = t.y-e.y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if(d<=rem){ e.x=t.x; e.y=t.y; e.wpIndex++; rem-=d; }
      else { e.x += dx/d*rem; e.y += dy/d*rem; rem=0; }
    }
    if(e.wpIndex >= wp.length){
      enemies.splice(i,1);
      lives -= 1;
      if(bossRef===e) bossRef = null;
      updateHUD();
      const ep = wp[wp.length-1];
      for(let k=0;k<15;k++){
        const a = Math.random()*Math.PI*2;
        parts.push({ x:ep.x, y:ep.y, vx:Math.cos(a)*200, vy:Math.sin(a)*200, life:0.6, maxLife:0.6, color:'#ff3333', size:6 });
      }
      if(lives<=0){ endGame(false); return; }
    }
  }
}

function useAbility(e){
  const ab = e.def.ability;
  if(ab.type === 'stun'){
    const rangePx = ab.range*CELL;
    let best=null, bestD=rangePx*rangePx;
    for(const t of towers){
      const tx = OX+(t.col+0.5)*CELL;
      const ty = OY+(t.row+0.5)*CELL;
      const dx = tx-e.x, dy = ty-e.y;
      const d2 = dx*dx+dy*dy;
      if(d2<bestD && (!t.stunnedUntil || performance.now()>=t.stunnedUntil)){ best=t; bestD=d2; }
    }
    if(best){
      best.stunnedUntil = performance.now() + ab.dur*1000;
      const tx = OX+(best.col+0.5)*CELL;
      const ty = OY+(best.row+0.5)*CELL;
      effects.push({ x1:e.x, y1:e.y, x2:tx, y2:ty, life:0.5, maxLife:0.5, color:'#cc66ff', type:'stun' });
    }
  }
  else if(ab.type === 'heal'){
    const rangePx = ab.range*CELL;
    for(const other of enemies){
      if(other===e) continue;
      const dx = other.x-e.x, dy = other.y-e.y;
      if(dx*dx+dy*dy < rangePx*rangePx && other.hp<other.maxHp){
        other.hp = Math.min(other.maxHp, other.hp+ab.amount);
        other.hitFlash = 0.2;
        parts.push({ x:other.x, y:other.y, vx:0, vy:-30, life:0.6, maxLife:0.6, color:'#66ff88', size:5 });
      }
    }
  }
  else if(ab.type === 'summon'){
    for(let k=0;k<ab.count;k++){
      const def = ENEMIES[ab.summonType];
      const hpScale = 1 + (wave-1)*0.3;
      const hp = Math.floor(def.hp*hpScale);
      enemies.push({
        type:ab.summonType, def, x:e.x+(Math.random()-0.5)*CELL, y:e.y+(Math.random()-0.5)*CELL,
        wpIndex:e.wpIndex, hp, maxHp:hp, speed:def.speed,
        slowUntil:0, slowFactor:1, hitFlash:0,
        ghost:false, boss:false, r:def.r, reward:def.reward, abilityCd:0,
        armor: def.armor || 0, poisonedUntil:0, poisonDps:0
      });
      parts.push({ x:e.x, y:e.y, vx:(Math.random()-0.5)*100, vy:(Math.random()-0.5)*100, life:0.5, maxLife:0.5, color:'#ff4444', size:5 });
    }
  }
}

function damageEnemy(e, dmg, towerType, towerLevel, hitsAll, pierceArmor){
  if(e.ghost){
    const canHit = (towerType==='archer' && towerLevel>=2) || hitsAll;
    if(!canHit) return false;
  }
  // Броня: только лучник и магия пробивают полностью
  if(e.armor > 0 && !pierceArmor && !hitsAll){
    dmg *= (1 - e.armor);
  }
  e.hitFlash = 0.15;
  if(e.heads){
    e.headHp -= dmg;
    if(e.headHp<=0){
      e.headIndex++; e.heads--;
      if(e.heads>0){
        e.headHp = e.maxHeadHp;
        for(let k=0;k<10;k++){
          const a = Math.random()*Math.PI*2;
          parts.push({ x:e.x, y:e.y, vx:Math.cos(a)*180, vy:Math.sin(a)*180, life:0.6, maxLife:0.6, color:'#4dff4d', size:6 });
        }
      }
    }
  } else e.hp -= dmg;
  return true;
}

function killEnemy(e, idx){
  enemies.splice(idx,1);
  money += e.reward;
  if(bossRef===e) bossRef = null;
  updateHUD(); updateCards();
  const count = e.boss ? 30 : (e.heads ? 20 : 8);
  const color = e.boss ? '#ffd700' : (e.def.color || '#ff4444');
  for(let k=0;k<count;k++){
    const a = Math.random()*Math.PI*2;
    const s = Math.random()*240+60;
    parts.push({ x:e.x, y:e.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.6, maxLife:0.6, color, size:e.boss?7:4 });
  }
}

function updateTowers(dt){
  const now = performance.now();
  for(const t of towers){
    if(t.stunnedUntil && now<t.stunnedUntil) continue;
    t.cd -= dt;
    if(t.cd>0) continue;
    const tx = OX+(t.col+0.5)*CELL;
    const ty = OY+(t.row+0.5)*CELL;
    const rangePx = t.range*CELL;
    const r2 = rangePx*rangePx;
    let best=null, bestScore=-Infinity;
    for(const e of enemies){
      if(e.ghost){
        const canHit = (t.type==='archer' && t.level>=2) || t.hitsAll;
        if(!canHit) continue;
      }
      const dx = e.x-tx, dy = e.y-ty;
      const d2 = dx*dx+dy*dy;
      if(d2>r2) continue;
      let score = e.wpIndex*1000000 - d2;
      if(e.boss) score += 200000;
      if(e.type==='succubus') score += 300000; // суккубы приоритет
      if(score>bestScore){ bestScore=score; best=e; }
    }
    if(!best) continue;
    t.cd = t.rate;
    t.angle = Math.atan2(best.y-ty, best.x-tx);
    effects.push({ x1:tx, y1:ty, x2:best.x, y2:best.y, life:0.14, maxLife:0.14, color:t.proj, type:'shot' });
    applyDamage(t, best);
    if(t.chain){
      let prev = best;
      const hitSet = new Set([best]);
      for(let c=1;c<t.chain;c++){
        let next=null, minD=(t.chainRange*CELL)**2;
        for(const e of enemies){
          if(hitSet.has(e)) continue;
          if(e.ghost && !(t.type==='archer' && t.level>=2) && !t.hitsAll) continue;
          const dx = e.x-prev.x, dy = e.y-prev.y;
          const d2 = dx*dx+dy*dy;
          if(d2<minD){ minD=d2; next=e; }
        }
        if(!next) break;
        applyDamage(t, next, 0.7);
        effects.push({ x1:prev.x, y1:prev.y, x2:next.x, y2:next.y, life:0.14, maxLife:0.14, color:t.proj, type:'chain' });
        hitSet.add(next);
        prev = next;
      }
    }
    for(let k=0;k<2;k++){
      const a = t.angle+(Math.random()-0.5)*0.6;
      parts.push({ x:tx, y:ty, vx:Math.cos(a)*130, vy:Math.sin(a)*130, life:0.15, maxLife:0.15, color:t.color, size:3 });
    }
  }
}

function applyDamage(t, e, mult){
  const m = mult===undefined ? 1 : mult;
  let dmg = t.dmg*m;
  if(t.splash){
    const sr = t.splash*CELL;
    for(const other of enemies){
      if(other.ghost && !(t.type==='archer' && t.level>=2) && !t.hitsAll) continue;
      const dx = other.x-e.x, dy = other.y-e.y;
      if(dx*dx+dy*dy <= sr*sr) damageEnemy(other, dmg*(other===e?1:0.7), t.type, t.level, t.hitsAll, t.pierceArmor);
    }
    for(let k=0;k<8;k++){
      const a = Math.random()*Math.PI*2;
      const s = Math.random()*200+50;
      parts.push({ x:e.x, y:e.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.35, maxLife:0.35,
        color: Math.random()<0.5?'#ffcc66':'#ff5522', size:4 });
    }
  } else {
    damageEnemy(e, dmg, t.type, t.level, t.hitsAll, t.pierceArmor);
    if(t.slow && !e.ghost){ e.slowUntil = performance.now() + t.slowDur*1000; e.slowFactor = t.slow; }
    if(t.poison){ e.poisonedUntil = performance.now() + t.poisonDur*1000; e.poisonDps = t.poison; }
    for(let k=0;k<3;k++){
      const a = Math.random()*Math.PI*2;
      parts.push({ x:e.x, y:e.y, vx:Math.cos(a)*110, vy:Math.sin(a)*110, life:0.25, maxLife:0.25, color:t.proj, size:3 });
    }
  }
}

function updateEffects(dt){
  for(let i=effects.length-1;i>=0;i--){ effects[i].life -= dt; if(effects[i].life<=0) effects.splice(i,1); }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.9; p.vy *= 0.9;
    p.life -= dt;
    if(p.life<=0) parts.splice(i,1);
  }
  if(parts.length>250) parts.splice(0, parts.length-250);
}

function updateAmbient(dt){
  for(const p of ambientParticles){
    p.x += p.vx*dt + Math.sin(performance.now()*0.001+p.y*0.01)*0.3;
    p.y += p.vy*dt;
    p.life -= dt;
    if(p.life<=0 || p.y<-20 || p.y>H+20 || p.x<-20 || p.x>W+20){
      p.x = Math.random()*W;
      p.y = currentMap.id==='forest' ? -10 : H+10;
      p.life = 2+Math.random()*2;
      p.maxLife = p.life;
    }
  }
}

function loop(time){
  rafId = requestAnimationFrame(loop);
  if(gameState!=='playing' || paused || cutsceneActive){ lastTime = time; return; }
  if(!lastTime) lastTime = time;
  let dt = Math.min(0.05, (time-lastTime)/1000);
  lastTime = time;
  dt *= timeScale;

  if(waveActive){
    spawnTimer -= dt;
    while(spawnQueue.length>0 && spawnTimer<=0){
      const item = spawnQueue.shift();
      spawnEnemy(item.type);
      spawnTimer += item.delay;
    }
    if(spawnQueue.length===0 && enemies.length===0){
      waveActive = false;
      money += 5;
      updateHUD(); updateCards();
      if(wave>=25) endGame(true);
      else saveProgress();
    }
  }

  updateEnemies(dt);
  updateTowers(dt);
  updateEffects(dt);
  updateParts(dt);
  updateAmbient(dt);
  draw();
}

function draw(){
  if(staticLayer){
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.drawImage(staticLayer, 0, 0);
    ctx.restore();
  } else {
    ctx.fillStyle = currentMap.bg1;
    ctx.fillRect(0,0,W,H);
  }

  if(!vignetteCache){
    vignetteCache = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
    vignetteCache.addColorStop(0,'rgba(0,0,0,0)');
    vignetteCache.addColorStop(1,'rgba(0,0,0,0.5)');
  }
  ctx.fillStyle = vignetteCache;
  ctx.fillRect(0,0,W,H);

  drawAnimatedDecorations();

  const ambCol = currentMap.id==='volcano' ? '#ff6622' : (currentMap.id==='hell' ? '#ff4444' : '#88cc66');
  ctx.fillStyle = ambCol;
  for(const p of ambientParticles){
    ctx.globalAlpha = (p.life/p.maxLife)*0.4;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const wp = wps();
  const sp = wp[0], ep = wp[wp.length-1];
  const now = performance.now();

  const pulse = 0.3 + Math.sin(now*0.003)*0.1;
  ctx.fillStyle = 'rgba(255,80,80,'+pulse+')';
  ctx.beginPath(); ctx.arc(sp.x, sp.y, CELL*0.35, 0, Math.PI*2); ctx.fill();

  const basePulse = 0.3 + Math.sin(now*0.002)*0.1;
  ctx.fillStyle = lives>1 ? 'rgba(80,255,120,'+basePulse+')' : 'rgba(255,50,50,'+basePulse+')';
  ctx.beginPath(); ctx.arc(ep.x, ep.y, CELL*0.5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = lives>1 ? '#79ff9c' : '#ff5555';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(ep.x, ep.y, CELL*0.55, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = getFont(Math.floor(CELL*0.5));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🏰', ep.x, ep.y);
  ctx.font = getFont(Math.floor(CELL*0.3), 'bold');
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  const hpText = '❤️'+lives;
  ctx.strokeText(hpText, ep.x, ep.y + CELL*0.6);
  ctx.fillStyle = lives>1 ? '#fff' : '#ff8888';
  ctx.fillText(hpText, ep.x, ep.y + CELL*0.6);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  for(const t of towers){
    if(!t.selected) continue;
    const tx = OX+(t.col+0.5)*CELL;
    const ty = OY+(t.row+0.5)*CELL;
    ctx.strokeStyle = 'rgba(255,215,0,.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.arc(tx, ty, t.range*CELL, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,215,0,.05)';
    ctx.beginPath(); ctx.arc(tx, ty, t.range*CELL, 0, Math.PI*2); ctx.fill();
    ctx.setLineDash([]);
  }

  for(const ef of effects){
    ctx.globalAlpha = (ef.life/ef.maxLife)*0.9;
    ctx.strokeStyle = ef.color;
    ctx.lineWidth = ef.type==='stun' ? 4 : (ef.type==='chain' ? 2 : 3);
    if(ef.type==='chain') ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(ef.x1,ef.y1); ctx.lineTo(ef.x2,ef.y2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  for(const t of towers) drawTower(t);
  for(const e of enemies) drawEnemy(e);

  const partsByColor = {};
  for(const p of parts){
    if(!partsByColor[p.color]) partsByColor[p.color] = [];
    partsByColor[p.color].push(p);
  }
  for(const color in partsByColor){
    ctx.fillStyle = color;
    for(const p of partsByColor[color]){
      ctx.globalAlpha = Math.max(0, p.life/p.maxLife);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size/2, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  if(bossRef && bossRef.hp!==undefined){
    const bw = W*0.8;
    const bx = (W-bw)/2;
    const by = 8;
    const bh = 14;
    ctx.fillStyle = 'rgba(0,0,0,.85)';
    ctx.fillRect(bx-2, by-2, bw+4, bh+4);
    ctx.fillStyle = '#222';
    ctx.fillRect(bx, by, bw, bh);
    let pct;
    if(bossRef.heads){
      const totalHp = bossRef.heads*bossRef.maxHeadHp;
      const curHp = (bossRef.heads-1)*bossRef.maxHeadHp + Math.max(0, bossRef.headHp);
      pct = curHp/totalHp;
    } else pct = bossRef.hp/bossRef.maxHp;
    ctx.fillStyle = '#dd2222';
    ctx.fillRect(bx, by, bw*pct, bh);
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.fillRect(bx, by, bw*pct, bh/2);
    ctx.fillStyle = '#fff';
    ctx.font = getFont(11, 'bold');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const name = bossRef.def.name + (bossRef.heads ? ' ('+bossRef.heads+' гол.)' : '') + (bossRef.def.armor ? ' 🛡' : '');
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeText(name, W/2, by+bh/2);
    ctx.fillText(name, W/2, by+bh/2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}

function drawAnimatedDecorations(){
  const dec = currentMap.decorations;
  if(!dec) return;
  if(dec.lava){
    const t = performance.now()*0.002;
    for(const [c,r] of dec.lava){
      if(currentPathSet.has(c+','+r)) continue;
      const x = OX+(c+0.5)*CELL;
      const y = OY+(r+0.5)*CELL;
      const pulse = 0.4 + Math.sin(t + c*0.7)*0.25;
      const lg = ctx.createRadialGradient(x,y,0,x,y,CELL*0.3);
      lg.addColorStop(0, 'rgba(255,200,50,'+pulse+')');
      lg.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.arc(x, y, CELL*0.3, 0, Math.PI*2); ctx.fill();
    }
  }
  if(dec.fire){
    const t = performance.now()*0.003;
    for(const [c,r] of dec.fire){
      if(currentPathSet.has(c+','+r)) continue;
      const x = OX+(c+0.5)*CELL;
      const y = OY+(r+0.5)*CELL;
      const fh = CELL*0.22 * (0.8+Math.sin(t*2 + c)*0.2);
      const fg = ctx.createLinearGradient(x, y+fh, x, y-fh*0.5);
      fg.addColorStop(0, 'rgba(255,200,50,.6)');
      fg.addColorStop(0.5, 'rgba(255,80,0,.5)');
      fg.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(x-8, y+fh);
      ctx.quadraticCurveTo(x-10, y, x, y-fh);
      ctx.quadraticCurveTo(x+10, y, x+8, y+fh);
      ctx.fill();
    }
  }
}

function drawTower(t){
  const x = OX+t.col*CELL;
  const y = OY+t.row*CELL;
  const cx = x+CELL/2;
  const cy = y+CELL/2;
  const stunned = t.stunnedUntil && performance.now()<t.stunnedUntil;

  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(cx, y+CELL*0.85, CELL*0.35, CELL*0.08, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath(); ctx.arc(cx, cy, CELL*0.4, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = stunned ? '#1a0a1a' : '#1a1a22';
  ctx.beginPath(); ctx.arc(cx, cy, CELL*0.35, 0, Math.PI*2); ctx.fill();

  if(!stunned){
    ctx.fillStyle = t.color;
    ctx.globalAlpha = 0.25;
    ctx.beginPath(); ctx.arc(cx, cy, CELL*0.38, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.strokeStyle = stunned ? '#ff66ff' : t.color;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, CELL*0.4, 0, Math.PI*2); ctx.stroke();

  for(let i=0;i<t.level;i++){
    const sx = cx - CELL*0.2 + i*CELL*0.2;
    const sy = y + CELL*0.13;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(sx, sy, CELL*0.055, 0, Math.PI*2); ctx.fill();
  }

  if(!stunned && t.angle!==undefined){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t.angle);
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.fillRect(2, -2, CELL*0.42, 6);
    ctx.fillStyle = t.color;
    ctx.fillRect(2, -3, CELL*0.42, 5);
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.fillRect(2, -3, CELL*0.42, 1.5);
    ctx.restore();
  }

  ctx.fillStyle = stunned ? '#666' : t.color;
  ctx.beginPath(); ctx.arc(cx, cy, CELL*0.22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(cx-CELL*0.05, cy-CELL*0.05, CELL*0.08, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.font = getFont(Math.floor(CELL*0.32));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t.icon, cx, cy);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  if(stunned){
    const remain = (t.stunnedUntil-performance.now())/1000;
    ctx.fillStyle = '#cc66ff';
    ctx.font = getFont(Math.floor(CELL*0.32), 'bold');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeText(remain.toFixed(1)+'s', cx, y-2);
    ctx.fillText(remain.toFixed(1)+'s', cx, y-2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}

function drawEnemy(e){
  const r = e.r*CELL;
  const now = performance.now();
  const slow = now<e.slowUntil;
  const poisoned = e.poisonedUntil>now;

  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(e.x, e.y+r*0.9, r*0.9, r*0.3, 0, 0, Math.PI*2); ctx.fill();

  if(e.boss){
    ctx.fillStyle = 'rgba(255,30,30,.35)';
    ctx.beginPath(); ctx.arc(e.x,e.y,r*1.7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,30,30,.15)';
    ctx.beginPath(); ctx.arc(e.x,e.y,r*2.2,0,Math.PI*2); ctx.fill();
  }

  let col = e.hitFlash>0 ? '#fff' : e.def.color;
  if(slow && e.hitFlash<=0) col = '#5599cc';
  if(poisoned && e.hitFlash<=0 && !slow) col = '#66cc44';

  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(e.x,e.y,r,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.2)';
  ctx.beginPath(); ctx.arc(e.x-r*0.3, e.y-r*0.3, r*0.5, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = e.hitFlash>0 ? '#ffff88' : e.def.border;
  ctx.lineWidth = e.boss ? 3 : 2;
  ctx.beginPath(); ctx.arc(e.x,e.y,r,0,Math.PI*2); ctx.stroke();

  // Индикатор брони
  if(e.armor > 0.3 && e.hitFlash<=0){
    ctx.strokeStyle = 'rgba(180,180,180,.8)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(e.x,e.y,r*0.82,0,Math.PI*2); ctx.stroke();
  }

  ctx.font = getFont(Math.floor(r*1.1));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e.def.icon, e.x, e.y);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  if(e.heads && e.heads>0){
    for(let h=0;h<e.heads;h++){
      const ang = -Math.PI/2 + (h-(e.heads-1)/2)*0.45;
      const hx = e.x+Math.cos(ang)*r*0.9;
      const hy = e.y+Math.sin(ang)*r*0.9;
      ctx.fillStyle = h===0?'#4dff4d':'#2d7a2d';
      ctx.beginPath(); ctx.arc(hx,hy,r*0.32,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#0d3d0d'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  if(!e.boss){
    let pct;
    if(e.heads){
      const totalHp = e.heads*e.maxHeadHp;
      const curHp = (e.heads-1)*e.maxHeadHp + Math.max(0, e.headHp);
      pct = curHp/totalHp;
    } else pct = Math.max(0, Math.min(1, e.hp/e.maxHp));
    const bw = r*2, bh = 4;
    const bx = e.x-r, by = e.y-r-9;
    ctx.fillStyle = 'rgba(0,0,0,.8)';
    ctx.fillRect(bx-1, by-1, bw+2, bh+2);
    ctx.fillStyle = '#222';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = pct>0.5 ? '#4caf50' : (pct>0.25?'#ff9800':'#f44336');
    ctx.fillRect(bx, by, bw*pct, bh);
  }

  if(slow){
    ctx.fillStyle = '#ccf4ff';
    ctx.font = getFont(Math.floor(r*1.2));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('❄', e.x, e.y+r*0.3);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
  if(poisoned){
    ctx.fillStyle = '#66ff66';
    ctx.font = getFont(Math.floor(r));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('☠', e.x+r*0.55, e.y-r*0.55);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}

let pDown = null;
canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  pDown = { x:e.clientX-r.left, y:e.clientY-r.top, t:Date.now() };
}, { passive:false });
canvas.addEventListener('pointerup', e=>{
  e.preventDefault();
  if(!pDown) return;
  const r = canvas.getBoundingClientRect();
  const px = e.clientX-r.left, py = e.clientY-r.top;
  const dx = px-pDown.x, dy = py-pDown.y;
  const dt = Date.now()-pDown.t;
  pDown = null;
  if(Math.sqrt(dx*dx+dy*dy)<30 && dt<700) tapCell(px, py);
}, { passive:false });
canvas.addEventListener('pointercancel', ()=>pDown=null);

function tapCell(px, py){
  if(gameState!=='playing' || cutsceneActive) return;
  const col = Math.floor((px-OX)/CELL);
  const row = Math.floor((py-OY)/CELL);
  if(col<0||col>=COLS||row<0||row>=ROWS) return;
  const onPath = currentPathSet.has(col+','+row);
  let existing = null;
  for(const t of towers){ if(t.col===col && t.row===row){ existing = t; break; } }
  for(const t of towers) t.selected = false;
  if(existing){
    existing.selected = true;
    if(existing.level >= 3) return;
    const cost = Math.floor(TOWER_DEFS[existing.type].cost * existing.level * 1.5);
    if(money<cost) return;
    money -= cost;
    existing.level++;
    existing.dmg = Math.floor(existing.dmg*1.35);
    existing.range *= 1.05;
    existing.rate *= 0.93;
    if(existing.poison) existing.poison = Math.floor(existing.poison*1.3);
    const cx = OX+(col+0.5)*CELL;
    const cy = OY+(row+0.5)*CELL;
    for(let k=0;k<12;k++){
      const a = Math.random()*Math.PI*2;
      parts.push({ x:cx, y:cy, vx:Math.cos(a)*140, vy:Math.sin(a)*140, life:0.5, maxLife:0.5, color:'#ffd700', size:5 });
    }
    updateHUD(); updateCards();
    return;
  }
  if(!selectedType) return;
  if(onPath) return;
  const def = TOWER_DEFS[selectedType];
  if(money<def.cost) return;
  money -= def.cost;
  towers.push({
    col, row, type:selectedType, icon:def.icon, color:def.color, proj:def.proj,
    level:1, dmg:def.dmg, range:def.range, rate:def.rate,
    slow:def.slow||0, slowDur:def.slowDur||0,
    splash:def.splash||0,
    chain:def.chain||0, chainRange:def.chainRange||0,
    poison:def.poison||0, poisonDur:def.poisonDur||0,
    hitsAll:def.hitsAll||false,
    pierceArmor:def.pierceArmor||false,
    cd:0, angle:-Math.PI/2, selected:false, stunnedUntil:0
  });
  const cx = OX+(col+0.5)*CELL;
  const cy = OY+(row+0.5)*CELL;
  for(let k=0;k<10;k++){
    const a = Math.random()*Math.PI*2;
    parts.push({ x:cx, y:cy, vx:Math.cos(a)*180, vy:Math.sin(a)*180, life:0.45, maxLife:0.45, color:def.color, size:5 });
  }
  updateHUD(); updateCards();
}

function bindTap(el, fn){
  let last = 0;
  const fire = e=>{
    const now = Date.now();
    if(now-last<300) return;
    last = now;
    if(e.cancelable!==false && e.preventDefault) e.preventDefault();
    e.stopPropagation();
    fn();
  };
  el.addEventListener('click', fire);
  el.addEventListener('touchstart', fire, { passive:false });
}

document.querySelectorAll('.tower-card').forEach(card=>{
  const type = card.getAttribute('data-type');
  bindTap(card, ()=>{
    if(gameState!=='playing' || cutsceneActive) return;
    selectedType = (selectedType===type) ? null : type;
    updateCards();
  });
});

bindTap(document.getElementById('waveBtn'), ()=>{
  if(gameState!=='playing' || cutsceneActive) return;
  if(waveActive) return;
  if(wave>=25) return;
  startWave();
});

bindTap(document.getElementById('speedBtn'), ()=>{
  if(timeScale === 1) timeScale = 2;
  else if(timeScale === 2) timeScale = 3;
  else timeScale = 1;
  document.getElementById('speedLbl').textContent = 'x'+timeScale;
  document.getElementById('speedBtn').classList.toggle('active', timeScale > 1);
});

bindTap(document.getElementById('pauseBtn'), ()=>{
  if(gameState!=='playing' || cutsceneActive) return;
  paused = !paused;
  document.getElementById('pauseBtn').classList.toggle('active', paused);
  document.getElementById('pauseBtn').innerHTML = paused ?
    '<span>▶</span><span class="lbl">ИГРА</span>' :
    '<span>⏸</span><span class="lbl">ПАУЗА</span>';
  if(!paused) lastTime = 0;
});

function endGame(victory){
  gameState = victory ? 'victory' : 'gameover';
  const leftover = money;
  const waveBonus = wave*12;
  const earned = leftover + waveBonus;
  save.bank += earned;
  if(wave > (save.bestWaves[currentMap.id]||0)) save.bestWaves[currentMap.id] = wave;
  if(victory){
    if(currentMap.id==='forest') save.unlocked.volcano = true;
    if(currentMap.id==='volcano') save.unlocked.hell = true;
  }
  save.pending = null;
  persistSave();
  updateHUD();
  const cs = victory ? STORIES[currentMap.id].victory : STORIES[currentMap.id].defeat;
  showCutscene(cs, ()=>showGameOver(victory, leftover, waveBonus, earned));
}

const overlay = document.getElementById('overlay');

function showMapSelect(){
  gameState = 'menu';
  let html = '<h1>⚔️ TOWER DEFENSE</h1><div class="desc">Три мира. 25 волн. 8 башен. Каждая нужна!</div>';
  html += '<div id="bankDisplay"><div class="lbl">🏦 БАНК</div><div class="amt">'+save.bank+' 💰</div><div class="hint">в игру идёт 30%</div></div>';
  for(const id of ['forest','volcano','hell']){
    const m = MAPS[id];
    const locked = !save.unlocked[id];
    const best = save.bestWaves[id]||0;
    const hasPending = save.pending && save.pending.mapId===id;
    html += '<button class="map-btn'+(locked?' locked':'')+'" data-map="'+id+'" type="button">' +
      (hasPending?'<div class="cont">▶ Волна '+(save.pending.wave+1)+'</div>':'') +
      '<div class="row1"><div class="icon">'+m.icon+'</div><div class="title">'+m.name+'</div><div class="diff" style="color:'+m.diffColor+'">'+m.difficulty+'</div></div>' +
      '<div class="desc">'+m.desc+(best>0?' • Лучшая: '+best:'')+'</div>' +
    '</button>';
  }
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px">';
  html += '<button id="smallBtn" type="button">Сбросить прогресс</button>';
  html += '</div>';
  overlay.innerHTML = html;
  overlay.classList.add('active');

  overlay.querySelectorAll('.map-btn').forEach(btn=>{
    bindTap(btn, ()=>{
      const id = btn.getAttribute('data-map');
      if(!save.unlocked[id]) return;
      const hasPending = save.pending && save.pending.mapId===id;
      if(hasPending){
        if(confirm('Продолжить с волны '+(save.pending.wave+1)+'?')) continueGame(id);
        else { save.pending = null; persistSave(); newGame(id); }
      } else newGame(id);
    });
  });
  bindTap(document.getElementById('smallBtn'), ()=>{
    if(confirm('Точно сбросить весь прогресс?')){
      save = { bank:0, unlocked:{forest:true,volcano:false,hell:false}, bestWaves:{forest:0,volcano:0,hell:0}, pending:null, storySeen:{forest:false,volcano:false,hell:false} };
      persistSave(); showMapSelect();
    }
  });
}

function newGame(mapId){
  resetState(mapId);
  resize();
  gameState = 'playing';
  paused = false;
  timeScale = 1;
  document.getElementById('speedLbl').textContent = 'x1';
  document.getElementById('speedBtn').classList.remove('active');
  document.getElementById('pauseBtn').classList.remove('active');
  document.getElementById('pauseBtn').innerHTML = '<span>⏸</span><span class="lbl">ПАУЗА</span>';
  overlay.classList.remove('active');
  lastTime = 0;
  draw();
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
  const intro = STORIES[mapId].intro;
  showCutscene(intro, ()=>{ lastTime = 0; });
}

function continueGame(mapId){
  const p = save.pending;
  if(!p || p.mapId!==mapId){ newGame(mapId); return; }
  resetState(mapId);
  wave = p.wave; money = p.money; lives = p.lives;
  towers = [];
  for(const t of (p.towers||[])){
    const def = TOWER_DEFS[t.type];
    if(!def) continue;
    let dmg = def.dmg, range = def.range, rate = def.rate, poison = def.poison||0;
    for(let l=1;l<t.level;l++){
      dmg = Math.floor(dmg*1.35); range *= 1.05; rate *= 0.93;
      if(poison) poison = Math.floor(poison*1.3);
    }
    towers.push({
      col:t.col, row:t.row, type:t.type, icon:def.icon, color:def.color, proj:def.proj,
      level:t.level, dmg, range, rate,
      slow:def.slow||0, slowDur:def.slowDur||0, splash:def.splash||0,
      chain:def.chain||0, chainRange:def.chainRange||0,
      poison, poisonDur:def.poisonDur||0, hitsAll:def.hitsAll||false,
      pierceArmor:def.pierceArmor||false,
      cd:0, angle:-Math.PI/2, selected:false, stunnedUntil:0
    });
  }
  updateHUD(); updateCards();
  resize();
  gameState = 'playing';
  paused = false;
  timeScale = 1;
  document.getElementById('speedLbl').textContent = 'x1';
  document.getElementById('speedBtn').classList.remove('active');
  document.getElementById('pauseBtn').classList.remove('active');
  document.getElementById('pauseBtn').innerHTML = '<span>⏸</span><span class="lbl">ПАУЗА</span>';
  overlay.classList.remove('active');
  lastTime = 0;
  draw();
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function showGameOver(victory, leftover, waveBonus, earned){
  let html = '';
  if(victory){
    html += '<h1>🏆 ПОБЕДА!</h1>';
    html += '<div class="desc">Ты прошёл карту <b>'+currentMap.name+'</b>!</div>';
  } else {
    html += '<h1>💀 ПОРАЖЕНИЕ</h1>';
    html += '<div class="desc">База пала на волне <b>'+wave+'</b></div>';
  }
  html += '<div class="box">' +
    'Остаток: <b>'+leftover+' 💰</b><br>' +
    'Бонус за волны ('+wave+'×12): <b>+'+waveBonus+' 💰</b><br>' +
    'Всего в банк: <b>+'+earned+' 💰</b><br>' +
    'Банк: <b>'+save.bank+' 💰</b><br>' +
    'Лучшая: <b>'+(save.bestWaves[currentMap.id]||0)+'</b>' +
  '</div>';
  if(victory && currentMap.id==='forest') html += '<div class="desc" style="color:#ff8800">🔥 Открыт <b>Вулкан</b>!</div>';
  else if(victory && currentMap.id==='volcano') html += '<div class="desc" style="color:#ff2222">🔥 Открыт <b>Ад</b>!</div>';
  html += '<button id="startBtn" type="button">К КАРТАМ</button>';
  overlay.innerHTML = html;
  overlay.classList.add('active');
  bindTap(document.getElementById('startBtn'), ()=>{ overlay.classList.remove('active'); showMapSelect(); });
}

loadSave();
resize();
showMapSelect();

})();
</script>
